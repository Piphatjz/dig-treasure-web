import sys

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#0a0c12"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "jaokhun_web"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/jaokhun_web
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("jaokhun_web.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("jaokhun_web.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "พร้อมแล้ว! คลิกที่หน้าจอเพื่อเริ่มเกม"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

    <script type="application/javascript">
    (function () {
        // คีย์ที่เกมใช้จริง (game.py): ลูกศร=เดิน/บิน/เจาะ, Shift=Gravity Slam, E=ร้าน, Enter, Esc, H=วิธีเล่น
        const KEYS = {
            ArrowUp:    { code: "ArrowUp",    keyCode: 38 },
            ArrowDown:  { code: "ArrowDown",  keyCode: 40 },
            ArrowLeft:  { code: "ArrowLeft",  keyCode: 37 },
            ArrowRight: { code: "ArrowRight", keyCode: 39 },
            Shift:      { code: "ShiftLeft",  keyCode: 16, location: 1 },
            e:          { code: "KeyE",       keyCode: 69 },
            h:          { code: "KeyH",       keyCode: 72 },
            Enter:      { code: "Enter",      keyCode: 13 },
            Escape:     { code: "Escape",     keyCode: 27 },
        };
        const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
        if (isTouch) document.body.classList.add("has-touch");

        function send(type, key) {
            const k = KEYS[key];
            const ev = new KeyboardEvent(type, { key: key, code: k.code, location: k.location || 0,
                shiftKey: key === "Shift" && type === "keydown", bubbles: true, cancelable: true });
            // Chrome/Safari ไม่รับ keyCode/which ผ่าน constructor — กำหนดเองให้ SDL อ่านได้
            Object.defineProperty(ev, "keyCode", { get: () => k.keyCode });
            Object.defineProperty(ev, "which", { get: () => k.keyCode });
            Object.defineProperty(ev, "charCode", { get: () => 0 });
            // SDL2 (emscripten) ฟังคีย์บอร์ดที่ window เป็นค่าเริ่มต้น; dispatch ที่ canvas แล้ว bubble ขึ้นถึง document/window
            (document.getElementById("canvas") || window).dispatchEvent(ev);
        }

        const held = new Map(); // touch identifier -> key
        function down(btn, id) {
            const key = btn.dataset.key;
            held.set(id, { key, btn });
            btn.classList.add("on");
            // นับจำนวนนิ้วที่กดคีย์เดียวกันอยู่ ส่ง keydown แค่ครั้งแรก
            let n = 0; held.forEach(v => { if (v.key === key) n++; });
            if (n === 1) send("keydown", key);
        }
        function up(id) {
            const h = held.get(id); if (!h) return;
            held.delete(id);
            let n = 0; held.forEach(v => { if (v.key === h.key) n++; });
            if (n === 0) { h.btn.classList.remove("on"); send("keyup", h.key); }
        }

        document.querySelectorAll("#touch-ui .tc-btn").forEach(btn => {
            btn.addEventListener("touchstart", e => {
                e.preventDefault(); e.stopPropagation();
                for (const t of e.changedTouches) down(btn, t.identifier);
            }, { passive: false });
            const end = e => { e.preventDefault(); e.stopPropagation(); for (const t of e.changedTouches) up(t.identifier); };
            btn.addEventListener("touchend", end, { passive: false });
            btn.addEventListener("touchcancel", end, { passive: false });
            // fallback เมาส์ (ทดสอบบนเดสก์ท็อป)
            btn.addEventListener("mousedown", e => { e.preventDefault(); down(btn, "m"); });
            btn.addEventListener("contextmenu", e => e.preventDefault());
        });
        window.addEventListener("mouseup", () => up("m"));
        // ปล่อยทุกปุ่มเมื่อสลับแอป/หมุนจอ กันรถวิ่งค้าง
        const releaseAll = () => [...held.keys()].forEach(up);
        window.addEventListener("blur", releaseAll);
        document.addEventListener("visibilitychange", releaseAll);
        window.addEventListener("orientationchange", () => { releaseAll(); setTimeout(() => window.window_resize && window.window_resize(), 300); });
        window.__touchSend = send; // สำหรับ debug
    })();
    </script>
